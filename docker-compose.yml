services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tccc_medical_db
    ports:
      # Host port 5433: a native Windows PostgreSQL service already occupies 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  db_test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tccc_medical_db
    ports:
      # Dedicated database for server e2e tests. Host 5432 is taken by a native
      # PostgreSQL service and 5433 by the `db` service above.
      - "5434:5432"

volumes:
  pgdata: