packages:
  - 'apps/*'
  - 'packages/*'
  - 'e2e'
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: false
  unrs-resolver: false
  workerd: true
# Prod-path advisories that upstream still pins exactly. All are build- or CLI-time only and never see
# request input. Remove each entry once its parent ships a patched version (follow-up to P0-003).
auditConfig:
  ignoreGhsas:
    # @serwist/build (service-worker build) pins zod 4.4.3 and browserslist 4.28.6
    - GHSA-mrhx-c7xc-m3w5
    - GHSA-c83g-rgw3-j3cx
    - GHSA-73wf-gq98-2v4g
    # prisma CLI pins mysql2 3.15.3 (unused, PostgreSQL only) and @prisma/config pins deepmerge-ts 7.1.5
    - GHSA-3f6p-5ww8-9rcr
    - GHSA-ggr8-5vv4-36mx
